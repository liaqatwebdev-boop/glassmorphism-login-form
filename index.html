<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Glassmorphism Login Form</title>

  <!-- Google Fonts (optional: agar load na ho to sans-serif fallback use hoga) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* 1. Global Box-Sizing & Reset */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    /* 2. Strictly Controlled Viewport Container (Prevents All Scrollbars) */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      max-width: 100vw;
      max-height: 100dvh;
      overflow: hidden !important;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #89216b 100%);
      background-size: 200% 200%;
      animation: gradientBG 12s ease infinite;
      padding: 16px;
      position: fixed;
      inset: 0;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 3. Responsive Animated Background Floating Elements */
    .bg-shapes {
      position: fixed;
      inset: 0;
      overflow: hidden;
      overflow: clip;
      z-index: 1;
      pointer-events: none;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(12px);
      z-index: 1;
      pointer-events: none;
    }

    .shape-1 {
      width: clamp(140px, 35vw, 220px);
      height: clamp(140px, 35vw, 220px);
      background: linear-gradient(#1845ad, #23a2f6);
      top: -30px;
      left: -30px;
      animation: floatShape1 8s ease-in-out infinite alternate;
    }

    .shape-2 {
      width: clamp(160px, 40vw, 260px);
      height: clamp(160px, 40vw, 260px);
      background: linear-gradient(to right, #ff512f, #dd2476);
      bottom: -40px;
      right: -30px;
      animation: floatShape2 10s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatShape1 {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(20px) rotate(15deg); }
    }

    @keyframes floatShape2 {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-20px) rotate(-15deg); }
    }

    /* 4. Responsive Main Glass Container */
    .login-container {
      width: 100%;
      max-width: 400px;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .glass {
      width: 100%;
      position: relative;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: clamp(24px, 5vh, 38px) clamp(20px, 5vw, 32px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25),
                  0 5px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* 5. Responsive Avatar Circle */
    .avatar-box {
      width: clamp(65px, 12vh, 85px);
      height: clamp(65px, 12vh, 85px);
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      margin: 0 auto clamp(12px, 2vh, 20px) auto;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(10px);
    }

    /* Inline SVG icons (replaces Font Awesome - no external loading needed) */
    .icon {
      display: block;
      fill: currentColor;
      flex-shrink: 0;
    }

    .avatar-box .icon {
      width: clamp(30px, 5vh, 40px);
      height: clamp(30px, 5vh, 40px);
      color: #ffffff;
    }

    /* 6. Titles & Subtitles */
    .glass h2 {
      color: #ffffff;
      font-size: clamp(22px, 4vh, 26px);
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .glass p.subtitle {
      color: rgba(255, 255, 255, 0.85);
      font-size: clamp(12px, 2vh, 14px);
      font-weight: 400;
      margin-bottom: clamp(16px, 3vh, 24px);
    }

    /* 7. Inputs and Form Layout */
    form {
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 2.2vh, 18px);
    }

    .input-box {
      position: relative;
      width: 100%;
    }

    .input-box .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: rgba(255, 255, 255, 0.85);
      pointer-events: none;
    }

    .input-box input {
      width: 100%;
      padding: clamp(11px, 1.8vh, 14px) 44px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      outline: none;
      font-size: 14px;
      color: #ffffff;
      font-weight: 400;
      transition: all 0.3s ease;
    }

    .input-box input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .input-box input:focus {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.75);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
    }

    /* Eye Toggle Icon */
    .toggle-password {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 23px;
      height: 23px;
      padding: 4px;
      color: rgba(255, 255, 255, 0.75);
      cursor: pointer;
      transition: color 0.3s ease;
      background: none;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-password .icon {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toggle-password .eye-off { display: none; }
    .toggle-password.visible .eye-on { display: none; }
    .toggle-password.visible .eye-off { display: block; }

    .toggle-password:hover {
      color: #ffffff;
    }

    /* Options / Forgot Password */
    .options-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -4px;
    }

    .forgot-link {
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .forgot-link:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* Glowing Submit Button */
    .btn {
      width: 100%;
      padding: clamp(11px, 1.8vh, 14px);
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      border: none;
      border-radius: 14px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 114, 255, 0.35);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 114, 255, 0.55);
      background: linear-gradient(135deg, #0072ff 0%, #00c6ff 100%);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Signup Prompt */
    p.signup {
      margin-top: clamp(16px, 2.5vh, 22px);
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
    }

    p.signup a {
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
      margin-left: 4px;
      transition: border-bottom 0.2s ease;
    }

    p.signup a:hover {
      border-bottom: 1px solid #ffffff;
    }

    /* Alert Message Box */
    .message-box {
      display: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 12px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .message-box.success {
      background: rgba(46, 213, 115, 0.3);
      border: 1px solid rgba(46, 213, 115, 0.6);
      color: #ffffff;
    }

    .message-box.error {
      background: rgba(255, 71, 87, 0.3);
      border: 1px solid rgba(255, 71, 87, 0.6);
      color: #ffffff;
    }

    /* Mobile: 16px inputs stop iOS Safari from zooming in on tap */
    @media (max-width: 768px) {
      .input-box input {
        font-size: 16px;
      }
    }

    /* 8. Ultra-Compact Media Queries for Small Heights */
    @media (max-height: 600px) {
      .glass {
        padding: 16px 20px;
      }
      .avatar-box {
        width: 50px;
        height: 50px;
        margin-bottom: 8px;
      }
      .avatar-box .icon {
        width: 24px;
        height: 24px;
      }
      .glass h2 {
        font-size: 20px;
      }
      .glass p.subtitle {
        margin-bottom: 12px;
      }
      form {
        gap: 10px;
      }
      p.signup {
        margin-top: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Abstract Floating Background Shapes -->
  <div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
  </div>

  <!-- Main Glassmorphism Form Container -->
  <div class="login-container">
    <div class="glass">

      <!-- Avatar Header (User Icon) -->
      <div class="avatar-box">
        <svg class="icon" viewBox="0 0 448 512" aria-hidden="true">
          <path d="M224 256A128 128 0 1 0 224 0a128 128 0 1 0 0 256zm-45.7 48C79.8 304 0 383.8 0 482.3C0 498.7 13.3 512 29.7 512H418.3c16.4 0 29.7-13.3 29.7-29.7C448 383.8 368.2 304 269.7 304H178.3z"/>
        </svg>
      </div>

      <h2>Welcome Back</h2>
      <p class="subtitle">Login to your account</p>

      <!-- Alert Notification Box -->
      <div id="messageBox" class="message-box"></div>

      <!-- Form Inputs -->
      <form id="loginForm" onsubmit="handleLogin(event)">

        <!-- Email Input -->
        <div class="input-box">
          <svg class="icon input-icon" viewBox="0 0 512 512" aria-hidden="true">
            <path d="M48 64C21.5 64 0 85.5 0 112c0 15.1 7.1 29.3 19.2 38.4L236.8 313.6c11.4 8.5 27 8.5 38.4 0L492.8 150.4c12.1-9.1 19.2-23.3 19.2-38.4c0-26.5-21.5-48-48-48H48zM0 176V384c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V176L294.4 339.2c-22.8 17.1-54 17.1-76.8 0L0 176z"/>
          </svg>
          <input
            type="email"
            id="email"
            placeholder="Email"
            required
            autocomplete="email"
          >
        </div>

        <!-- Password Input -->
        <div class="input-box">
          <svg class="icon input-icon" viewBox="0 0 448 512" aria-hidden="true">
            <path d="M144 144v48H304V144c0-44.2-35.8-80-80-80s-80 35.8-80 80zM80 192V144C80 64.5 144.5 0 224 0s144 64.5 144 144v48h16c35.3 0 64 28.7 64 64V448c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V256c0-35.3 28.7-64 64-64H80z"/>
          </svg>
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
            autocomplete="current-password"
          >
          <button type="button" class="toggle-password" id="togglePassword" onclick="togglePasswordVisibility()" aria-label="Show or hide password">
            <!-- Eye (password hidden) -->
            <svg class="icon eye-on" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Eye slash (password visible) -->
            <svg class="icon eye-off" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>

        <!-- Options / Forgot Link -->
        <div class="options-row">
          <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">Forgot Password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn" id="submitBtn">Login</button>
      </form>

      <!-- Signup Prompt -->
      <p class="signup">
        Don't have an account? <a href="#" onclick="handleSignup(event)">Sign Up</a>
      </p>

    </div>
  </div>

  <!-- Interactive JavaScript Logic -->
  <script>
    // 1. Password Visibility Toggle
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('togglePassword');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.classList.add('visible');
      } else {
        passwordInput.type = 'password';
        toggleBtn.classList.remove('visible');
      }
    }

    // 2. Notification Message Box Display Logic
    function showMessage(text, type) {
      const msgBox = document.getElementById('messageBox');
      msgBox.innerText = text;
      msgBox.className = `message-box ${type}`;
      msgBox.style.display = 'block';

      setTimeout(() => {
        msgBox.style.display = 'none';
      }, 3500);
    }

    // 3. Form Submission Handling
    function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const submitBtn = document.getElementById('submitBtn');

      if (!email || !password) {
        showMessage('Please fill in all fields.', 'error');
        return;
      }

      // Simulate loading state
      submitBtn.innerText = 'Logging in...';
      submitBtn.style.opacity = '0.8';
      submitBtn.disabled = true;

      setTimeout(() => {
        submitBtn.innerText = 'Login';
        submitBtn.style.opacity = '1';
        submitBtn.disabled = false;

        showMessage('Login successful! Welcome back.', 'success');
      }, 1200);
    }

    // 4. Action Handlers for Forgot Link and Signup Prompt
    function handleForgotPassword(e) {
      e.preventDefault();
      showMessage('Password reset link sent to your email.', 'success');
    }

    function handleSignup(e) {
      e.preventDefault();
      showMessage('Redirecting to Sign Up page...', 'success');
    }
  </script>
</body>
</html>
